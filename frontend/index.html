<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock CMS - Exam Scheduling & Result Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  
<header class="topbar">
  <!-- Left: Burger Menu -->
  <div class="menu-container">
    <button id="burgerBtn" class="burger-icon-btn hidden" aria-label="Open menu">
      ☰
    </button>
    <div id="navDropdown" class="menu-popover hidden">
      <div class="menu-header">Menu</div>
      <button data-view="dashboard" class="menu-item active">📊 Dashboard</button>
      <button data-view="courses" class="menu-item">📚 Courses</button>
      <button data-view="examinations" class="menu-item">📝 Examinations</button>
      <button data-view="results" class="menu-item">🎓 Results</button>
      <hr class="menu-divider">
      <button data-view="notifications" class="menu-item">🔔 Notifications</button>
    </div>
  </div>

  <!-- Center: Brand Title -->
  <div class="brand">
    <span class="brand-name">MockCMS</span>
  </div>

  <!-- Right: Role, User Name & Logout -->
  <div id="userbox" class="userbox hidden">
    <span id="roleLabel" class="role-badge hidden"></span>
    <span id="userLabel" class="user-label"></span>
    <button id="logoutBtn" class="btn-logout">Log out</button>
  </div>
</header>

<main id="app">

  <!-- LOGIN VIEW -->
  <section id="view-login" class="view active">
    <div class="auth-card">
      <h1>Sign in to Mock CMS</h1>
      <p class="muted">Exam Scheduling &amp; Result Management System</p>

      <form id="loginForm">
        <label>Email
          <input type="email" id="loginEmail" required placeholder="admin@uptm.edu.my">
        </label>
        <label>Password
          <input type="password" id="loginPassword" required placeholder="Password123!">
        </label>
        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <div id="loginError" class="error hidden"></div>

      <div class="demo-accounts">
        <p class="muted small">Demo accounts (password for all: <code>Password123!</code>)</p>
        <ul>
          <li><button class="chip" data-email="admin@uptm.edu.my">Admin — Aisha Rahman</button></li>
          <li><button class="chip" data-email="kumar@uptm.edu.my">Lecturer — Dr. Kumar Selvam</button></li>
          <li><button class="chip" data-email="ali@student.uptm.edu.my">Student — Ali Hajar</button></li>
        </ul>
      </div>

      <p class="muted small">API base URL: <code id="apiBaseLabel"></code></p>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view">
    <h2>Dashboard</h2>
    <div id="dashboardCards" class="card-grid"></div>
  </section>

  <!-- COURSES -->
  <section id="view-courses" class="view">
    <div class="view-header">
      <h2>Courses</h2>
      <div class="toolbar">
        <input type="search" id="courseSearch" placeholder="Search courses…">
        <button id="courseAddBtn" class="btn-primary small admin-only hidden">+ New course</button>
      </div>
    </div>
    <table class="data-table">
      <thead>
        <tr><th>Code</th><th>Course</th><th>Faculty</th><th>Lecturer</th><th></th></tr>
      </thead>
      <tbody id="coursesTableBody"></tbody>
    </table>
    <div class="pager" id="coursesPager"></div>
  </section>

  <!-- EXAMINATIONS -->
  <section id="view-examinations" class="view">
    <div class="view-header">
      <h2>Examinations</h2>
      <div class="toolbar">
        <input type="search" id="examSearch" placeholder="Search venue / course…">
        <button id="examAddBtn" class="btn-primary small staff-only hidden">+ Schedule exam</button>
      </div>
    </div>
    <table class="data-table">
      <thead>
        <tr><th>Course</th><th>Date</th><th>Time</th><th>Venue</th><th></th></tr>
      </thead>
      <tbody id="examsTableBody"></tbody>
    </table>
    <div class="pager" id="examsPager"></div>
  </section>

  <!-- RESULTS -->
  <section id="view-results" class="view">
    <div class="view-header">
      <h2>Results</h2>
      <div class="toolbar">
        <button id="resultAddBtn" class="btn-primary small staff-only hidden">+ Publish result</button>
      </div>
    </div>
    <table class="data-table">
      <thead>
        <tr><th>Student</th><th>Course</th><th>Score</th><th>Grade</th><th>Published</th></tr>
      </thead>
      <tbody id="resultsTableBody"></tbody>
    </table>
    <div class="pager" id="resultsPager"></div>
  </section>

  <!-- NOTIFICATIONS -->
  <section id="view-notifications" class="view">
    <h2>Notifications</h2>
    <ul id="notificationsList" class="notif-list"></ul>
  </section>

</main>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Title</h3>
      <button id="modalClose" class="btn-ghost">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
